# Production-like local stack: PostgreSQL + backend. (Not exercised during development: Docker was not available on the dev machine.)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env}
      POSTGRES_DB: prism
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U prism"], interval: 5s, retries: 10 }
  backend:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://prism:${POSTGRES_PASSWORD}@db:5432/prism
      PRISM_ENV: production
      PRISM_COOKIE_SECURE: "0"   # set to 1 behind HTTPS
    ports: ["8000:8000"]
volumes: { pgdata: {} }
