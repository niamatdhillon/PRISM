# One-click Render blueprint: a single web service (API + website) and a PostgreSQL database.
# Render: New + -> Blueprint -> pick this GitHub repo. You will be asked for the two secret values below.
# NOTE: Render's free Postgres expires after ~30 days; use a paid plan for real research data.
services:
  - type: web
    name: prism
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - { key: PRISM_ENV, value: production }
      - { key: PRISM_EMBEDDINGS, value: auto }
      - { key: DATABASE_URL, fromDatabase: { name: prism-db, property: connectionString } }
      - { key: PRISM_BOOTSTRAP_ADMIN_EMAIL, sync: false }      # your email: becomes the first admin
      - { key: PRISM_BOOTSTRAP_ADMIN_PASSWORD, sync: false }   # choose a strong password (12+ chars); delete this variable after first sign-in
databases:
  - name: prism-db
    plan: free
