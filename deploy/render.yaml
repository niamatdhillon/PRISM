# Render blueprint (backend + managed PostgreSQL). Untested: no Render account/CLI was available during development.
services:
  - type: web
    name: prism-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - { key: PRISM_ENV, value: production }
      - { key: PRISM_EMBEDDINGS, value: lsa }
      - { key: DATABASE_URL, fromDatabase: { name: prism-db, property: connectionString } }
databases:
  - name: prism-db
    plan: free   # free Postgres instances expire; use a paid plan for real research data
